aid: tidelift
name: Tidelift
description: >-
  Tidelift provides open-source software supply-chain management for enterprises. Its
  platform combines package intelligence (maintenance, quality, end-of-life, and
  vulnerability signals) with catalogs of approved dependencies, policy and license
  standards enforcement, SBOM import/export, and "alignment" of projects against an
  organization's standards. Tidelift is distinctive for paying the open-source
  maintainers ("lifters") behind the packages enterprises rely on. The Tidelift External
  API (OpenAPI 3.0, Bearer API-key auth) exposes catalogs, violations, projects, groups,
  packages, releases, vulnerabilities, licenses, and reporting. Tidelift was acquired by
  Sonar in 2025; the API and developer surface remain active.
